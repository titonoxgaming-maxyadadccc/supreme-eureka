name: T Play APK (from zip)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        shell: bash
        run: |
          unzip -q T-Play-GitHub-Actions-Package.zip -d project
          ROOT=$(find project -maxdepth 3 -name settings.gradle.kts | awk '{print length($0) " " $0}' | sort -n | head -1 | cut -d' ' -f2- | xargs dirname)
          echo "Project root: $ROOT"
          test -f "$ROOT/gradlew"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK packages
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          (yes || true) | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.2" "build-tools;37.0.0" || echo "sdkmanager step failed, Gradle will try to download the SDK itself"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_ROOT"
          chmod +x ./gradlew
          ./gradlew --no-daemon --no-configuration-cache --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvmargs="-Xmx3g" \
            :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show errors
        if: failure()
        shell: bash
        run: |
          grep -nE "^e: |error:|What went wrong|FAILED|Could not" -A4 build.log | head -150 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: T-Play-debug-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
